zerops:
  - setup: app
    build:
      base: python@3.11
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y git-lfs
      buildCommands:
        - git lfs install
        - git lfs pull
        - pip install --upgrade pip
        - pip install setuptools
        - pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
        - pip install -r requirements.txt
      deployFiles:
        - ./
      cache:
        - /root/.cache/pip
    run:
      base: python@3.11
      os: ubuntu
      ports:
        - port: 8080
          protocol: TCP
          httpSupport: true
      start: gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 app:app
      envVariables:
        PYTHONUNBUFFERED: "1"
        FLASK_ENV: "production"
