zerops:
  - setup: app
    build:
      os: ubuntu
      base: python@3.11
      addToRunPrepare:
        - requirements.txt
      deployFiles:
        - app/
        - data/
        - models/
        - static/
        - templates/
        - run.py
        - init_db.py
        - requirements.txt
    run:
      os: ubuntu
      base: python@3.11
      ports:
        - port: 8080
          protocol: TCP
          httpSupport: true
      prepareCommands:
        - pip install --no-cache-dir setuptools
        - pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
        - pip install --no-cache-dir -r requirements.txt
      start: gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 app:app
      envVariables:
        PYTHONUNBUFFERED: "1"
        FLASK_ENV: "production"
