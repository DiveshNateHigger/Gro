zerops:
  - setup: app
    build:
      base: python@3.11
      os: ubuntu
      prepareCommands:
        - sudo apt-get update
        - sudo apt-get install -y git-lfs
      buildCommands:
        - git lfs install
        - git lfs pull
      deployFiles:
        - ./
    run:
      base: python@3.11
      os: ubuntu
      ports:
        - port: 8080
          protocol: TCP
          httpSupport: true
      prepareCommands:
        - pip install --no-cache-dir setuptools
        - pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
        - pip install --no-cache-dir -r requirements.txt
      start: gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 app:app
      envVariables:
        PYTHONUNBUFFERED: "1"
        FLASK_ENV: "production"
